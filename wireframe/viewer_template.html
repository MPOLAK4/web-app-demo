<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>__TITLE__</title>
<style>
  body { margin: 0; font: 14px Arial, Helvetica, sans-serif; background: #eceff1; color: #222; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 14px; background: #263238; color: #fff; }
  header h1 { margin: 0 12px 0 0; font-size: 16px; }
  header label { display: flex; gap: 4px; align-items: center; }
  button, a.button { font: inherit; padding: 4px 10px; border: 1px solid #90a4ae; border-radius: 4px; background: #fff; color: #222; cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
  nav { min-width: 150px; }
  nav h2, aside h2 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; color: #546e7a; }
  nav button { display: block; width: 100%; margin-bottom: 4px; text-align: left; }
  nav button[aria-current="true"] { background: #263238; color: #fff; }
  #picture { position: relative; box-shadow: 0 1px 6px rgba(0, 0, 0, .35); background: #fff; flex: none; }
  #picture img { display: block; }
  .hotspot { position: absolute; cursor: pointer; border: 0; padding: 0; background: transparent; border-radius: 3px; }
  .hotspot:hover, .hotspot:focus { outline: 2px solid #1e88e5; background: rgba(30, 136, 229, .15); }
  aside { min-width: 220px; max-width: 320px; }
  #event-list button, #choice-box button { display: block; margin-bottom: 4px; }
  #message { min-height: 2.6em; margin: 8px 0; }
  #choice-box { margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="doc-name"></h1>
  <label>Data <select id="data-mode"><option value="debug">debug</option><option value="live">live</option></select></label>
  <button id="btn-back" type="button">Back</button>
  <button id="btn-restart" type="button">Restart</button>
  <a id="save-svg" class="button" download="screen.svg">Save SVG</a>
</header>
<main>
  <nav><h2>Screens</h2><div id="screen-list"></div></nav>
  <div id="picture"></div>
  <aside>
    <h2 id="screen-title"></h2>
    <div id="message" role="status"></div>
    <div id="choice-box"></div>
    <h2>Events on this screen</h2>
    <div id="event-list"></div>
  </aside>
</main>
<script type="application/json" id="wireframe-data">__DATA__</script>
<script>
// This page only LOOKS THINGS UP in the data above, which Python computed when the
// file was built. It does not decide where an event leads, how a block looks, or
// what a block says. It cannot edit the wireframe or load another one.
"use strict";
const D = JSON.parse(document.getElementById("wireframe-data").textContent);
const $ = (id) => document.getElementById(id);
let current = D.initial;
let trail = [];          // screens visited before this one, for Back
let mode = "debug";

function say(text) { $("message").textContent = text; $("choice-box").replaceChildren(); }

function button(text, onclick) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.onclick = onclick;
  return b;
}

function go(id, remember) {
  if (remember) trail.push(current);
  current = id;
  draw();
}

function raise(event) {
  const result = D.states[current].steps[event];
  if (!result) { say(`Nothing here raises "${event}".`); return; }
  if (result.status === "moved") {
    const from = current;
    go(result.state, true);
    say(`${event}: ${from} -> ${result.state}`);
  } else if (result.status === "stuck") {
    say(`Stuck: no transition handles "${event}" on this screen.`);
  } else {
    say(`"${event}" could go several ways. Pick one:`);
    for (const o of result.options) {
      $("choice-box").append(button(`if ${o.guard || "(no guard)"} -> ${o.target}`, () => {
        const from = current;
        go(o.target, true);
        say(`${event} (${o.transition}): ${from} -> ${o.target}`);
      }));
    }
  }
}

function draw() {
  const s = D.states[current];
  $("doc-name").textContent = D.name;
  $("screen-title").textContent = s.title + (s.final ? " (final screen)" : "");
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.svg[mode]);
  const img = document.createElement("img");
  img.src = url;
  img.alt = s.title;
  img.width = D.canvas.width;
  img.height = D.canvas.height;
  const box = $("picture");
  box.style.width = D.canvas.width + "px";
  box.style.height = D.canvas.height + "px";
  box.replaceChildren(img);
  for (const h of s.hotspots) {
    const spot = document.createElement("button");
    spot.type = "button";
    spot.className = "hotspot";
    spot.title = h.event;
    spot.style.left = h.x + "px";
    spot.style.top = h.y + "px";
    spot.style.width = h.w + "px";
    spot.style.height = h.h + "px";
    spot.onclick = () => raise(h.event);
    box.append(spot);
  }
  $("event-list").replaceChildren(...s.events.map((e) => button(e, () => raise(e))));
  $("screen-list").replaceChildren(...D.order.map((id) => {
    const b = button(D.states[id].title, () => { say(""); go(id, true); });
    b.setAttribute("aria-current", String(id === current));
    return b;
  }));
  $("btn-back").disabled = trail.length === 0;
  const link = $("save-svg");
  link.href = url;
  link.download = (D.name + "-" + current).replace(/[^A-Za-z0-9_-]+/g, "-") + ".svg";
}

$("data-mode").onchange = (e) => { mode = e.target.value; draw(); };
$("btn-back").onclick = () => { if (trail.length) { current = trail.pop(); say(""); draw(); } };
$("btn-restart").onclick = () => { trail = []; current = D.initial; say(""); draw(); };
document.title = D.name + " (viewer)";
draw();
</script>
</body>
</html>
